[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pet-hospital-mcp"
version = "1.0.0"
description = "MCP server wrapping the Go pet hospital REST API (single tool: list_pets)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Teaching Example" }]

dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pet_hospital_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
